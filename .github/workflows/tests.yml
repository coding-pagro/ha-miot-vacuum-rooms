name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum version (hacs.json), first release with CLEAN_AREA
          - ha: "2026.3"
            python: "3.14"
            install: pytest-homeassistant-custom-component==0.13.320
          # Current version
          - ha: "2026.10"
            python: "3.14"
            install: -r requirements_test.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ${{ matrix.install }}
      - name: Test
        run: python -m pytest
