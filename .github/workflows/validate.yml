name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@22.5.0
        with:
          category: integration
          # Submitting brand assets to home-assistant/brands is deliberately
          # out of scope: this is a custom HACS repository, not part of the
          # HACS default store, so the brands check does not apply.
          ignore: brands
